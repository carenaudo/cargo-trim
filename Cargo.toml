[package]
name = "cargo-trim"
version = "0.1.0"
edition = "2021"
authors = ["Carlos Renaudo <c.a.renaudo@gmail.com>"]
description = "Fast, standalone tool and Cargo plugin to scan and clean Cargo build target directories across nested project hierarchies"
license = "MIT"
readme = "README.md"
repository = "https://github.com/carenaudoplq/cargo-trim"
keywords = ["cargo", "cleanup", "target", "disk-space", "cli"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
